<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layout renderer comparison</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 24px;
        background: #f5f5f5;
        color: #222;
      }
      .controls {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        margin-block: 16px;
      }
      label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      button,
      select {
        font: inherit;
      }
      #viewport {
        width: 100%;
        height: 65vh;
        background: white;
        border: 1px solid #888;
        overflow: hidden;
        touch-action: none;
      }
      svg,
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      output {
        display: block;
        margin-block: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Layout renderer comparison</h1>
    <p>
      Drag a rectangle to move it; drag empty space to pan. Use the wheel or
      buttons to zoom. Escape cancels a drag. Arrow keys move the selected
      rectangle (Shift: 10 units). This is a synthetic experiment, not the
      finished editor.
    </p>
    <div class="controls">
      <label
        >Renderer
        <select id="renderer">
          <option>SVG</option>
          <option>Canvas</option>
        </select></label
      >
      <label
        >Rectangles
        <select id="count">
          <option>100</option>
          <option>1000</option>
          <option selected>10000</option>
        </select></label
      >
      <label><input id="labels" type="checkbox" /> Labels</label>
      <button id="zoomIn">Zoom in</button><button id="zoomOut">Zoom out</button>
      <button id="reset">Reset view</button>
      <button id="benchmark">Run 120-frame pan benchmark</button>
    </div>
    <div id="viewport" tabindex="0" aria-label="Synthetic layout preview"></div>
    <output id="selection" aria-live="polite">No rectangle selected.</output>
    <output id="metrics" aria-live="polite"></output>
    <script>
      const viewport = document.querySelector("#viewport");
      const renderer = document.querySelector("#renderer");
      const count = document.querySelector("#count");
      const labels = document.querySelector("#labels");
      const metrics = document.querySelector("#metrics");
      const benchmark = document.querySelector("#benchmark");
      const ns = "http://www.w3.org/2000/svg";
      let elements = [],
        surface,
        group,
        context;
      let x = 0,
        y = 0,
        zoom = 1;
      let gesture = null,
        selectedId = null,
        previousSelectedId = null;
      const nodes = new Map();
      const selection = document.querySelector("#selection");
      let pending = 0,
        run = 0;
      const view = { width: 1, height: 1 };

      function svgElement(tag, attributes) {
        const element = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attributes))
          element.setAttribute(key, value);
        return element;
      }

      function rebuild() {
        finishGesture(false);
        selectedId = previousSelectedId = null;
        selection.textContent = "No rectangle selected.";
        nodes.clear();
        run++;
        benchmark.disabled = false;
        const start = performance.now();
        elements = Array.from({ length: Number(count.value) }, (_, i) => ({
          id: `seat-${i}`,
          x: (i % 100) * 24 + 10,
          y: Math.floor(i / 100) * 24 + 10,
          width: 18,
          height: 18,
          label: String(i + 1),
        }));
        viewport.replaceChildren();
        if (renderer.value === "SVG") {
          surface = svgElement("svg", {
            role: "img",
            "aria-label": "SVG seat layout",
          });
          group = svgElement("g", {});
          const fragment = document.createDocumentFragment();
          for (const element of elements) {
            const node = svgElement("g", {
              transform: `translate(${element.x} ${element.y})`,
            });
            const shape = svgElement("rect", {
              x: 0,
              y: 0,
              width: element.width,
              height: element.height,
              rx: 2,
              fill: "#3974b9",
            });
            node.append(shape);
            if (labels.checked) {
              const text = svgElement("text", {
                x: 9,
                y: 12,
                "text-anchor": "middle",
                "font-size": 7,
                fill: "white",
              });
              text.textContent = element.label;
              node.append(text);
            }
            nodes.set(element.id, { node, shape });
            fragment.append(node);
          }
          group.append(fragment);
          surface.append(group);
        } else {
          surface = document.createElement("canvas");
          surface.setAttribute("aria-label", "Canvas seat layout");
          context = surface.getContext("2d");
        }
        viewport.append(surface);
        resize();
        metrics.textContent = `${renderer.value}, ${elements.length} rectangles\nScene construction + initial draw submission: ${(performance.now() - start).toFixed(2)} ms\nNot a paint-completion measurement.`;
      }

      function resize() {
        view.width = viewport.clientWidth;
        view.height = viewport.clientHeight;
        if (renderer.value === "SVG")
          surface.setAttribute("viewBox", `0 0 ${view.width} ${view.height}`);
        else {
          surface.width = Math.round(view.width * devicePixelRatio);
          surface.height = Math.round(view.height * devicePixelRatio);
        }
        draw();
      }

      function draw() {
        if (renderer.value === "SVG") {
          group.setAttribute(
            "transform",
            `translate(${x} ${y}) scale(${zoom})`,
          );
          if (previousSelectedId && previousSelectedId !== selectedId) {
            nodes
              .get(previousSelectedId)
              ?.shape.setAttribute("fill", "#3974b9");
          }
          if (selectedId) {
            const element = elements.find((item) => item.id === selectedId);
            const node = nodes.get(selectedId);
            const position =
              gesture?.elementId === selectedId ? gesture.preview : element;
            node.node.setAttribute(
              "transform",
              `translate(${position.x} ${position.y})`,
            );
            node.shape.setAttribute("fill", "#b45309");
          }
          previousSelectedId = selectedId;
          return;
        }
        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(0, 0, surface.width, surface.height);
        context.setTransform(
          devicePixelRatio * zoom,
          0,
          0,
          devicePixelRatio * zoom,
          devicePixelRatio * x,
          devicePixelRatio * y,
        );
        for (const element of elements) {
          const position =
            gesture?.elementId === element.id ? gesture.preview : element;
          context.fillStyle = element.id === selectedId ? "#b45309" : "#3974b9";
          context.fillRect(
            position.x,
            position.y,
            element.width,
            element.height,
          );
          if (labels.checked) {
            context.fillStyle = "white";
            context.font = "7px sans-serif";
            context.textAlign = "center";
            context.fillText(element.label, position.x + 9, position.y + 12);
          }
        }
      }

      function scheduleDraw() {
        if (!pending)
          pending = requestAnimationFrame(() => {
            pending = 0;
            draw();
          });
      }
      function scale(factor, cx = view.width / 2, cy = view.height / 2) {
        if (gesture) return;
        const next = Math.min(8, Math.max(0.1, zoom * factor));
        x = cx - ((cx - x) * next) / zoom;
        y = cy - ((cy - y) * next) / zoom;
        zoom = next;
        scheduleDraw();
      }
      function pointerPosition(event) {
        const rect = viewport.getBoundingClientRect();
        return {
          x: event.clientX - rect.left - viewport.clientLeft,
          y: event.clientY - rect.top - viewport.clientTop,
        };
      }
      function hitTest(point) {
        const px = (point.x - x) / zoom,
          py = (point.y - y) / zoom;
        // Same reverse-order baseline for both renderers, including moved objects.
        for (let i = elements.length - 1; i >= 0; i--) {
          const element = elements[i];
          if (
            px >= element.x &&
            px <= element.x + element.width &&
            py >= element.y &&
            py <= element.y + element.height
          )
            return element;
        }
        return null;
      }
      function updateSelection() {
        const element = elements.find((item) => item.id === selectedId);
        selection.textContent = element
          ? `${element.id}: x=${element.x.toFixed(2)}, y=${element.y.toFixed(2)}`
          : "No rectangle selected.";
      }
      function updateGesture(event) {
        if (!gesture || gesture.pointerId !== event.pointerId) return;
        const point = pointerPosition(event);
        const dx = point.x - gesture.start.x,
          dy = point.y - gesture.start.y;
        if (gesture.elementId)
          gesture.preview = {
            x: gesture.origin.x + dx / zoom,
            y: gesture.origin.y + dy / zoom,
          };
        else {
          x = gesture.origin.x + dx;
          y = gesture.origin.y + dy;
        }
        scheduleDraw();
      }
      function finishGesture(commit) {
        if (!gesture) return;
        const active = gesture;
        if (active.elementId && commit) {
          elements = elements.map((element) =>
            element.id === active.elementId
              ? { ...element, ...active.preview }
              : element,
          );
        } else if (!active.elementId && !commit) {
          x = active.origin.x;
          y = active.origin.y;
        }
        gesture = null;
        if (viewport.hasPointerCapture(active.pointerId))
          viewport.releasePointerCapture(active.pointerId);
        updateSelection();
        scheduleDraw();
      }
      viewport.addEventListener("pointerdown", (event) => {
        if (benchmark.disabled || gesture || event.button !== 0) return;
        event.preventDefault();
        viewport.focus();
        const point = pointerPosition(event);
        const hit = hitTest(point);
        selectedId = hit?.id ?? null;
        gesture = {
          pointerId: event.pointerId,
          elementId: selectedId,
          start: point,
          origin: hit ? { x: hit.x, y: hit.y } : { x, y },
          preview: hit ? { x: hit.x, y: hit.y } : null,
        };
        viewport.setPointerCapture(event.pointerId);
        updateSelection();
        scheduleDraw();
      });
      viewport.addEventListener("pointermove", updateGesture);
      viewport.addEventListener("pointerup", (event) => {
        if (gesture?.pointerId !== event.pointerId) return;
        updateGesture(event);
        finishGesture(true);
      });
      for (const event of ["pointercancel", "lostpointercapture"])
        viewport.addEventListener(event, (event) => {
          if (gesture?.pointerId === event.pointerId) finishGesture(false);
        });
      viewport.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          finishGesture(false);
          return;
        }
        if (gesture || benchmark.disabled || !selectedId) return;
        const delta = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1],
        }[event.key];
        if (!delta) return;
        event.preventDefault();
        const step = event.shiftKey ? 10 : 1;
        elements = elements.map((element) =>
          element.id === selectedId
            ? {
                ...element,
                x: element.x + delta[0] * step,
                y: element.y + delta[1] * step,
              }
            : element,
        );
        updateSelection();
        scheduleDraw();
      });
      viewport.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          if (benchmark.disabled) return;
          const point = pointerPosition(event);
          scale(Math.exp(-event.deltaY * 0.001), point.x, point.y);
        },
        { passive: false },
      );
      document.querySelector("#zoomIn").onclick = () => {
        if (!benchmark.disabled) scale(1.25);
      };
      document.querySelector("#zoomOut").onclick = () => {
        if (!benchmark.disabled) scale(0.8);
      };
      document.querySelector("#reset").onclick = () => {
        finishGesture(false);
        run++;
        benchmark.disabled = false;
        x = y = 0;
        zoom = 1;
        scheduleDraw();
      };
      for (const input of [renderer, count, labels])
        input.onchange = () => {
          x = y = 0;
          zoom = 1;
          rebuild();
        };
      benchmark.onclick = () => {
        finishGesture(false);
        const token = ++run;
        benchmark.disabled = true;
        const intervals = [],
          submissions = [];
        let last,
          frame = 0;
        x = y = 0;
        zoom = 1;
        function tick(time) {
          if (token !== run) return;
          if (last !== undefined) intervals.push(time - last);
          last = time;
          const start = performance.now();
          x = -frame * 3;
          y = -frame * 2;
          draw();
          submissions.push(performance.now() - start);
          if (++frame < 120) requestAnimationFrame(tick);
          else {
            benchmark.disabled = false;
            const percentile = (values) =>
              [...values]
                .sort((a, b) => a - b)
                [Math.ceil(values.length * 0.95) - 1].toFixed(2);
            metrics.textContent = `${renderer.value}, ${elements.length} rectangles, labels ${labels.checked ? "on" : "off"}, DPR ${devicePixelRatio}\nViewport ${view.width} × ${view.height}\np95 frame interval: ${percentile(intervals)} ms\np95 JS draw submission: ${percentile(submissions)} ms\nSVG browser rendering occurs after submission. Use DevTools for paint, memory, and long tasks.\n${navigator.userAgent}`;
          }
        }
        requestAnimationFrame(tick);
      };
      const observer = new ResizeObserver(() => {
        if (surface) resize();
      });
      observer.observe(viewport);
      rebuild();
      window.addEventListener("pagehide", () => {
        finishGesture(false);
        run++;
        observer.disconnect();
        cancelAnimationFrame(pending);
      });
    </script>
  </body>
</html>
